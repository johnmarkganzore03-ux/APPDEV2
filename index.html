<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #2c3e50;
            line-height: 1.7;
        }

        nav {
            background-color: #1a2a6c;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2.5rem;
            justify-content: center;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #4a90e2;
        }

        
        header {
            text-align: center;
            padding: 5rem 2rem;
            background: linear-gradient(135deg, #1a2a6c, #275d8c);
            color: white;
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 1.2rem;
            color: #e0e0e0;
            font-weight: 300;
        }

        
        .container {
            max-width: 750px;
            margin: 4rem auto;
            padding: 3rem 2.5rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
	   font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }

        .welcome-section h2 {
            font-size: 2rem;
            color: #1a2a6c;
            margin-bottom: 1.5rem;
        }

        .welcome-section p {
            font-size: 1.15rem;
            color: #4a5568;
            margin-bottom: 2rem;
        }

        .btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        footer {
            background-color: #1a2a6c;
            color: #a0aec0;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    </ul>
  </nav>

</body>
</html>
